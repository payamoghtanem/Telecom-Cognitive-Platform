version: 2

models:
  - name: silver_fact_network_usage
    description: "Silver canonical network usage fact model"
    tests:
      - bytes_non_negative
    columns:
      - name: usage_pk
        description: "Deterministic fact primary key"
        tests:
          - not_null
          - unique
      - name: customer_key_hash
        description: "Hashed customer key identifier"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key_hash
      - name: total_bytes
        description: "Combined downlink and uplink bytes"
        tests:
          - not_null

  - name: audit_reconciliation
    description: "Audit reconciliation: returns rows when staging vs silver diverge for active partition"
    tests:
      - no_rows
